name: Mirror Congress trades (House+Senate)

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *" # daily 06:20 UTC

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download datasets
        run: |
          set -euo pipefail
          mkdir -p data/house data/senate

          UA="CongressTradesMirror/0.1 (public-interest)"

          fetch() {
            name="$1"
            url="$2"
            out="$3"
            echo "== $name =="
            code="$(curl -sS -L --retry 3 --retry-delay 2 -A "$UA" -w '%{http_code}' -o "$out.tmp" "$url" || true)"
            echo "$name http_code=$code url=$url"
            if [ "$code" != "200" ]; then
              rm -f "$out.tmp"
              return 1
            fi
            mv "$out.tmp" "$out"
            return 0
          }

          # Prefer official S3. If blocked, fallback to older GitHub mirrors (better than empty).
          if ! fetch "house_s3" "https://house-stock-watcher-data.s3-us-west-2.amazonaws.com/data/all_transactions.json" "data/house/all_transactions.json"; then
            echo "House S3 failed; falling back to GitHub mirror (may be stale)."
            fetch "house_fallback" "https://raw.githubusercontent.com/timothycarambat/house-stock-watcher-data/master/data/all_transactions.json" "data/house/all_transactions.json" || true
          fi

          if ! fetch "senate_s3" "https://senate-stock-watcher-data.s3-us-west-2.amazonaws.com/aggregate/all_transactions.json" "data/senate/all_transactions.json"; then
            echo "Senate S3 failed; falling back to GitHub mirror (may be stale)."
            fetch "senate_fallback" "https://raw.githubusercontent.com/timothycarambat/senate-stock-watcher-data/master/aggregate/all_transactions.json" "data/senate/all_transactions.json" || true
          fi

          # Write status file for debugging freshness/blocking.
          {
            echo "updated_utc=$(date -u +%FT%TZ)"
            echo "house_path=data/house/all_transactions.json"
            echo "senate_path=data/senate/all_transactions.json"
          } > data/STATUS.txt

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, sys, pathlib
          for p in [
              pathlib.Path("data/house/all_transactions.json"),
              pathlib.Path("data/senate/all_transactions.json"),
          ]:
              if not p.exists():
                  print(f"Missing: {p}", file=sys.stderr)
                  raise SystemExit(2)
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"Invalid JSON: {p}: {e}", file=sys.stderr)
                  raise
          print("JSON ok")
          PY

      - name: Commit changes (if any)
        run: |
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "congress-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Mirror update $(date -u +%F)"
          git push

