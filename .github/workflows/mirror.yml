name: Mirror Congress trades (House+Senate)

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *" # daily 06:20 UTC

concurrency:
  group: congress-trades-mirror
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch/mirror (S3 + official fallbacks)
        env:
          MIRROR_UA: "CongressTradesMirror/0.2 (public-interest)"
          # Senate EFD is sometimes unstable; mirrors are used as fallback.
          # You can override with SENATE_MIRROR_URLS in repo/workflow env.
          SENATE_EFD_DAYS: "60"
          SENATE_EFD_MAX_REPORTS: "120"
          SENATE_EFD_MAX_PAGES: "6"
          SENATE_EFD_PAGE_SIZE: "100"
          # Do not accept stale Senate mirrors.
          SENATE_MIN_DATE: "2026-01-01"
        run: |
          python mirror_fetch.py

      - name: Show STATUS.txt
        run: |
          echo "---- data/STATUS.txt ----"
          cat data/STATUS.txt || true

      - name: Upload STATUS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror-status
          path: data/STATUS.txt

      - name: Upload House debug texts (if any)
        uses: actions/upload-artifact@v4
        with:
          name: house-ptr-debug
          path: data/house/debug/
          if-no-files-found: ignore

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, sys, pathlib
          for p in [
              pathlib.Path("data/house/all_transactions.json"),
              pathlib.Path("data/senate/all_transactions.json"),
          ]:
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"Invalid JSON: {p}: {e}", file=sys.stderr)
                  raise
          print("JSON ok")
          PY

      - name: Commit changes (if any)
        run: |
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi

          # If only STATUS.txt changed, skip committing (avoids noisy commits + push races).
          changed="$(git status --porcelain | awk '{print $2}')"
          non_status="$(echo "$changed" | grep -v '^data/STATUS.txt$' || true)"
          if [ -z "$non_status" ]; then
            echo "Only data/STATUS.txt changed; skipping commit."
            exit 0
          fi

          git config user.name "congress-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Mirror update $(date -u +%F)"
          # If another run pushed meanwhile, rebase and retry.
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push; then
              exit 0
            fi
            echo "Push failed, retrying ($i/3)..."
            sleep $((i*2))
          done
          echo "Push failed after retries"
          exit 1

