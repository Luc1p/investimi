name: Mirror Congress trades (House+Senate)

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *" # daily 06:20 UTC

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch/mirror (S3 + official fallbacks)
        env:
          MIRROR_UA: "CongressTradesMirror/0.2 (public-interest)"
        run: |
          python mirror_fetch.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, sys, pathlib
          for p in [
              pathlib.Path("data/house/all_transactions.json"),
              pathlib.Path("data/senate/all_transactions.json"),
          ]:
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"Invalid JSON: {p}: {e}", file=sys.stderr)
                  raise
          print("JSON ok")
          PY

      - name: Commit changes (if any)
        run: |
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "congress-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Mirror update $(date -u +%F)"
          # If another run pushed meanwhile, rebase and retry.
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push; then
              exit 0
            fi
            echo "Push failed, retrying ($i/3)..."
            sleep $((i*2))
          done
          echo "Push failed after retries"
          exit 1

